[pytest]
addopts = -v --tb=short
testpaths = tests
pythonpath = .
timeout = 60
markers =
    ui: UI tests (BlazeDemo)
    api: API tests (AirportGap)
    e2e: Cross-layer tests — API preconditions verified, UI behavior asserted
    smoke: Critical path — confirms the system is alive; run on every commit
    regression: Full coverage — edge cases, validation, error handling; run on release
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
